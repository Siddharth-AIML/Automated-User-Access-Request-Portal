<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Portal - Login</title>
</head>

<body>

    <h1>Automated User Access Request Portal</h1>

    <h2>Login</h2>

    <form action="/login" method="post">

        <!-- CSRF Token required by Spring Security -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="username">Email:</label>

        <input
                type="email"
                id="username"
                name="username"
                required>

        <br><br>

        <label for="password">Password:</label>

        <input
                type="password"
                id="password"
                name="password"
                required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <!-- Displayed when authentication fails -->
    <p style="color: red;">
        <span th:if="${param.error}">
            Invalid email or password.
        </span>
    </p>

    <!-- Displayed after successful logout -->
    <p style="color: green;">
        <span th:if="${param.logout}">
            You have been logged out successfully.
        </span>
    </p>

</body>

</html>
